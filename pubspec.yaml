name: ceylon_heritage
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.0.4

  # Google Sign-In
  google_sign_in: ^7.2.0

  # Profile image picker
  image_picker: ^1.2.1
  path_provider: ^2.1.6

  # Open Google Maps / URLs
  url_launcher: ^6.3.2

  # Map & Routing
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  map_launcher: ^3.4.1
  http: ^1.2.2
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/services/
    - assets/images/services/anuradhapura/
    - assets/images/services/polonnaruwa/
    - assets/images/services/kandy/
    - assets/images/services/jaffna/
    - assets/images/services/downsouth/
    - assets/images/services/dambulla/
    - assets/Sound/Anuradhapura.mp3
    - assets/Sound/Dambulla.mp3
    - assets/Sound/DownSouth.mp3
    - assets/Sound/Jaffna.mp3
    - assets/Sound/Kandy.mp3
    - assets/Sound/Pollonnaruwa.mp3